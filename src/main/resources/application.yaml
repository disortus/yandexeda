spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME:demo}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.demo: ${LOG_LEVEL_APP:DEBUG}

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    cors-allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    cors-allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id}
    cors-exposed-headers: ${CORS_EXPOSED_HEADERS:X-Request-Id}

  jwt:
    issuer: ${JWT_ISSUER:demo-api}
    secret: ${JWT_SECRET:change-this-secret-in-dev-and-prod-please-min-32-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://localhost:5432/demo_dev}
    username: ${DEV_DB_USER:postgres}
    password: ${DEV_DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DEV_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DEV_DB_POOL_MIN_IDLE:2}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${DEV_SHOW_SQL:true}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL:jdbc:postgresql://localhost:5432/demo_prod}
    username: ${PROD_DB_USER:postgres}
    password: ${PROD_DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${PROD_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${PROD_DB_POOL_MIN_IDLE:4}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${TEST_DB_URL:jdbc:sqlite:file:./demo-test.db}
    username: ${TEST_DB_USER:}
    password: ${TEST_DB_PASS:}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
